<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模块四：坐标系统与空间计算</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>
    <script src="shared-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.12.1/proj4.min.js"></script>
    <link href="shared-style.css" rel="stylesheet">
    <style>
        /* 左侧：坐标转换面板 */
        #convertPanel {
            position: absolute; top: 66px; left: 16px; z-index: 10;
            background: rgba(11, 30, 61, .94); color: #fff;
            padding: 16px 20px; border-radius: 8px; border: 1px solid #36c9b0;
            width: 320px; font-size: 13px; max-height: calc(100vh - 90px); overflow-y: auto;
        }
        #convertPanel h3 { color: #36c9b0; font-size: 14px; margin: 14px 0 8px; }
        #convertPanel h3:first-child { margin-top: 0; }
        .field-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .field-row label { flex: 0 0 72px; color: #a8bdd0; font-size: 12px; text-align: right; }
        .field-row input {
            flex: 1; padding: 6px 8px; background: rgba(255,255,255,.08);
            border: 1px solid #526f82; color: #fff; border-radius: 4px;
            font-family: 'Consolas', monospace; font-size: 13px;
        }
        .field-row input:focus { border-color: #36c9b0; outline: none; }
        .field-row input[readonly] { background: rgba(46,197,173,.08); color: #36c9b0; }
        .btn {
            display: block; width: 100%; padding: 8px; margin: 8px 0;
            background: #36c9b0; color: #fff; border: none; border-radius: 4px;
            cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .btn:hover { background: #26a08d; }
        .btn-outline {
            background: transparent; border: 1px solid #36c9b0; color: #36c9b0;
        }
        .btn-outline:hover { background: rgba(46,197,173,.15); }
        .proj4-result { margin-top: 6px; padding: 8px; background: rgba(46,197,173,.08); border-radius: 4px; font-family: 'Consolas', monospace; font-size: 12px; color: #36c9b0; min-height: 20px; }
        #coordBar { padding: 8px 24px; gap: 32px; }
        #coordBar .coord-value { min-width: 80px; }
    </style>
</head>
<body>
    <div id="header">
        <h1>模块四：<span>坐标系统与空间计算</span><span class="badge">CDN Cesium</span></h1>
        <a href="index.html">← 返回讲解文档</a>
    </div>
    <div id="cesiumContainer"></div>

    <!-- 左侧：坐标转换 -->
    <div id="convertPanel">
        <h3>WGS84 → Cartesian3</h3>
        <div class="field-row"><label>经度 (°)</label><input type="number" id="inLng" value="116.3975" step="0.0001"></div>
        <div class="field-row"><label>纬度 (°)</label><input type="number" id="inLat" value="39.9087" step="0.0001"></div>
        <div class="field-row"><label>高度 (m)</label><input type="number" id="inAlt" value="43.5" step="1"></div>
        <button class="btn" onclick="wgs84ToCartesian()">转换 →</button>
        <div class="field-row"><label>X</label><input type="text" id="outX" readonly></div>
        <div class="field-row"><label>Y</label><input type="text" id="outY" readonly></div>
        <div class="field-row"><label>Z</label><input type="text" id="outZ" readonly></div>
        <button class="btn btn-outline" onclick="flyToInput()">飞行至该坐标并标注</button>

        <hr class="divider">

        <h3>Cartesian3 → WGS84</h3>
        <div class="field-row"><label>X</label><input type="number" id="inCX" value="-2187691" step="100"></div>
        <div class="field-row"><label>Y</label><input type="number" id="inCY" value="4372929" step="100"></div>
        <div class="field-row"><label>Z</label><input type="number" id="inCZ" value="4092766" step="100"></div>
        <button class="btn" onclick="cartesianToWgs84()">转换 →</button>
        <div class="field-row"><label>经度 (°)</label><input type="text" id="outLng" readonly></div>
        <div class="field-row"><label>纬度 (°)</label><input type="text" id="outLat" readonly></div>
        <div class="field-row"><label>高度 (m)</label><input type="text" id="outAlt" readonly></div>

        <hr class="divider">

        <h3>EPSG 坐标系转换 (proj4)</h3>
        <div class="field-row">
            <label>源坐标系</label>
            <select id="srcEpsg" style="flex:1;padding:6px 8px;background:#1a2d4a;border:1px solid #526f82;color:#fff;border-radius:4px;font-size:12px;">
                <option value="EPSG:4326" style="background:#1a2d4a;color:#fff;">EPSG:4326 (WGS84)</option>
                <option value="EPSG:3857" style="background:#1a2d4a;color:#fff;">EPSG:3857 (Web Mercator)</option>
                <option value="EPSG:4490" style="background:#1a2d4a;color:#fff;">EPSG:4490 (CGCS2000)</option>
            </select>
        </div>
        <div class="field-row"><label>X / 经度</label><input type="number" id="p4X" value="116.3975" step="0.0001"></div>
        <div class="field-row"><label>Y / 纬度</label><input type="number" id="p4Y" value="39.9087" step="0.0001"></div>
        <div class="field-row">
            <label>目标坐标系</label>
            <select id="dstEpsg" style="flex:1;padding:6px 8px;background:#1a2d4a;border:1px solid #526f82;color:#fff;border-radius:4px;font-size:12px;">
                <option value="EPSG:3857" style="background:#1a2d4a;color:#fff;">EPSG:3857 (Web Mercator)</option>
                <option value="EPSG:4326" style="background:#1a2d4a;color:#fff;">EPSG:4326 (WGS84)</option>
                <option value="EPSG:4490" style="background:#1a2d4a;color:#fff;">EPSG:4490 (CGCS2000)</option>
            </select>
        </div>
        <button class="btn" onclick="proj4Convert()">proj4 转换 →</button>
        <div class="proj4-result" id="p4Result">等待转换…</div>

        <hr class="divider">

        <h3>快捷操作</h3>
        <button class="btn btn-outline" onclick="clearMarkers()">清除所有标注点</button>
    </div>
    <!-- 底部实时坐标条 -->
    <div id="coordBar">
        <div class="coord-group">
            <span class="coord-label">Screen</span>
            <span class="coord-value" id="coordScreen">--, --</span>
        </div>
        <div class="coord-group">
            <span class="coord-label">WGS84</span>
            <span class="coord-value" id="coordWgs84">--, --, --</span>
        </div>
        <div class="coord-group">
            <span class="coord-label">Cartesian3</span>
            <span class="coord-value" id="coordCartesian">--, --, --</span>
        </div>
        <div class="coord-group" style="margin-left:auto;color:#526f82;">
            移动鼠标查看实时坐标转换
        </div>
    </div>

    <script>
        (async function () {
            const viewer = new Cesium.Viewer('cesiumContainer', {
                baseLayerPicker: false, geocoder: false, homeButton: false,
                sceneModePicker: false, navigationHelpButton: false,
                animation: false, timeline: false, fullscreenButton: false,
                selectionIndicator: false, infoBox: false
            });

            try {
                viewer.terrainProvider = await Cesium.CesiumTerrainProvider.fromIonAssetId(1);
            } catch (e) { console.warn('Terrain fallback:', e); }

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(116.3975, 39.9087, 2000000),
                duration: 0
            });

            let markerCount = 0;

            // ── 实时坐标跟踪 ──
            const coordScreen = document.getElementById('coordScreen');
            const coordWgs84 = document.getElementById('coordWgs84');
            const coordCartesian = document.getElementById('coordCartesian');

            const moveHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            moveHandler.setInputAction(function (movement) {
                const pos = movement.endPosition;
                coordScreen.textContent = pos.x.toFixed(0) + ', ' + pos.y.toFixed(0);

                const cartesian = viewer.camera.pickEllipsoid(pos, viewer.scene.globe.ellipsoid);
                if (Cesium.defined(cartesian)) {
                    const carto = Cesium.Cartographic.fromCartesian(cartesian);
                    const lng = Cesium.Math.toDegrees(carto.longitude);
                    const lat = Cesium.Math.toDegrees(carto.latitude);
                    coordWgs84.textContent = lng.toFixed(6) + '°, ' + lat.toFixed(6) + '°, ' + carto.height.toFixed(1) + 'm';
                    coordCartesian.textContent = cartesian.x.toFixed(1) + ', ' + cartesian.y.toFixed(1) + ', ' + cartesian.z.toFixed(1);
                } else {
                    coordWgs84.textContent = '--, --, --';
                    coordCartesian.textContent = '--, --, --';
                }
            }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

            // ── 点击标注 ──
            const clickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            clickHandler.setInputAction(function (click) {
                const cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
                if (!Cesium.defined(cartesian)) return;

                const carto = Cesium.Cartographic.fromCartesian(cartesian);
                const lng = Cesium.Math.toDegrees(carto.longitude);
                const lat = Cesium.Math.toDegrees(carto.latitude);
                markerCount++;

                viewer.entities.add({
                    id: 'marker-' + markerCount,
                    position: cartesian,
                    point: { pixelSize: 10, color: Cesium.Color.fromCssColorString('#36c9b0'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                    label: {
                        text: '#' + markerCount + '\n' + lng.toFixed(4) + '°, ' + lat.toFixed(4) + '°',
                        font: '12px Consolas, monospace',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -14),
                        showBackground: true,
                        backgroundColor: new Cesium.Color(0.04, 0.09, 0.18, 0.85)
                    }
                });

                console.log('[Marker #' + markerCount + ']', {
                    screen: { x: click.position.x, y: click.position.y },
                    wgs84: { lng: lng, lat: lat, alt: carto.height },
                    cartesian3: { x: cartesian.x, y: cartesian.y, z: cartesian.z }
                });
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // ── WGS84 → Cartesian3 ──
            window.wgs84ToCartesian = function () {
                const lng = parseFloat(document.getElementById('inLng').value);
                const lat = parseFloat(document.getElementById('inLat').value);
                const alt = parseFloat(document.getElementById('inAlt').value) || 0;
                if (isNaN(lng) || isNaN(lat)) return;

                const cartesian = Cesium.Cartesian3.fromDegrees(lng, lat, alt);
                document.getElementById('outX').value = cartesian.x.toFixed(4);
                document.getElementById('outY').value = cartesian.y.toFixed(4);
                document.getElementById('outZ').value = cartesian.z.toFixed(4);
            };

            // ── Cartesian3 → WGS84 ──
            window.cartesianToWgs84 = function () {
                const x = parseFloat(document.getElementById('inCX').value);
                const y = parseFloat(document.getElementById('inCY').value);
                const z = parseFloat(document.getElementById('inCZ').value);
                if (isNaN(x) || isNaN(y) || isNaN(z)) return;

                const cartesian = new Cesium.Cartesian3(x, y, z);
                const carto = Cesium.Cartographic.fromCartesian(cartesian);
                document.getElementById('outLng').value = Cesium.Math.toDegrees(carto.longitude).toFixed(6) + '°';
                document.getElementById('outLat').value = Cesium.Math.toDegrees(carto.latitude).toFixed(6) + '°';
                document.getElementById('outAlt').value = carto.height.toFixed(2) + ' m';
            };

            // ── 飞行并标注 ──
            window.flyToInput = function () {
                const lng = parseFloat(document.getElementById('inLng').value);
                const lat = parseFloat(document.getElementById('inLat').value);
                const alt = parseFloat(document.getElementById('inAlt').value) || 0;
                if (isNaN(lng) || isNaN(lat)) return;

                markerCount++;
                const position = Cesium.Cartesian3.fromDegrees(lng, lat, alt);
                viewer.entities.add({
                    id: 'marker-' + markerCount,
                    position: position,
                    point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#e74c3c'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                    label: {
                        text: '#' + markerCount + ' (输入)\n' + lng.toFixed(4) + '°, ' + lat.toFixed(4) + '°',
                        font: '12px Consolas, monospace',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -16),
                        showBackground: true,
                        backgroundColor: new Cesium.Color(0.04, 0.09, 0.18, 0.85)
                    }
                });

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(lng, lat, Math.max(alt + 5000, 5000)),
                    duration: 1.5
                });
            };

            // ── 清除标注 ──
            window.clearMarkers = function () {
                viewer.entities.removeAll();
                markerCount = 0;
            };

            // 初始转换
            wgs84ToCartesian();

            // ── proj4 坐标系转换 ──
            proj4.defs('EPSG:4490', '+proj=longlat +ellps=GRS80 +no_defs');

            window.proj4Convert = function () {
                var srcCode = document.getElementById('srcEpsg').value;
                var dstCode = document.getElementById('dstEpsg').value;
                var x = parseFloat(document.getElementById('p4X').value);
                var y = parseFloat(document.getElementById('p4Y').value);
                var resultEl = document.getElementById('p4Result');
                if (isNaN(x) || isNaN(y)) { resultEl.textContent = '请输入有效数值'; return; }
                if (srcCode === dstCode) { resultEl.textContent = '源和目标坐标系相同'; return; }

                try {
                    var result = proj4(srcCode, dstCode, [x, y]);
                    var isGeo = dstCode === 'EPSG:4326' || dstCode === 'EPSG:4490';
                    var precision = isGeo ? 6 : 2;
                    resultEl.textContent = 'X: ' + result[0].toFixed(precision) + '\nY: ' + result[1].toFixed(precision);
                } catch (e) {
                    resultEl.textContent = '转换失败: ' + e.message;
                }
            };
        })();
    </script>
</body>
</html>
