<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模块二：Entity API</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>
    <script src="shared-config.js"></script>
    <link href="shared-style.css" rel="stylesheet">
    <style>
        #panel {
            position: absolute; top: 70px; left: 16px; z-index: 10;
            background: rgba(11, 30, 61, .92); color: #fff;
            padding: 16px 20px; border-radius: 8px; border: 1px solid #2ec5ad;
            width: 280px; font-size: 13px;
        }
        #panel h3 { color: #2ec5ad; font-size: 15px; margin-bottom: 12px; }
        #panel button {
            display: block; width: 100%; padding: 8px 14px; margin: 6px 0;
            background: #2ec5ad; color: #fff; border: none; border-radius: 4px;
            cursor: pointer; font-size: 13px; transition: background .2s;
        }
        #panel button:hover { background: #26a08d; }
        #panel button.danger { background: #e74c3c; }
        #panel button.danger:hover { background: #c0392b; }
        #queryPanel {
            position: absolute; top: 70px; right: 16px; z-index: 10;
            background: rgba(11, 30, 61, .92); color: #fff;
            padding: 16px 20px; border-radius: 8px; border: 1px solid #2ec5ad;
            min-width: 300px; font-size: 13px;
        }
        #queryPanel h3 { color: #2ec5ad; font-size: 15px; margin-bottom: 12px; }
        #queryInput {
            width: 100%; padding: 8px; background: rgba(255,255,255,.1);
            border: 1px solid #526f82; color: #fff; border-radius: 4px; font-size: 13px;
        }
        #queryResult {
            margin-top: 10px; padding: 10px;
            background: rgba(0,0,0,.3); border-radius: 4px;
            font-family: 'Consolas', monospace; font-size: 12px;
            min-height: 60px; white-space: pre-wrap; color: #8ecae6;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>模块二：<span>Entity API</span><span class="badge">超图 Cesium</span></h1>
        <a href="index.html">← 返回讲解文档</a>
    </div>
    <div id="cesiumContainer"></div>
    <div id="panel">
        <h3>Entity 基础操作</h3>
        <button onclick="addSampleEntities()">添加监测站（3 个）</button>
        <button onclick="addBatchEntities()">批量添加 50 个</button>
        <button onclick="updateEntityStyle()">修改实体样式</button>
        <button onclick="removeLastEntity()" class="danger">删除最后一个</button>
        <button onclick="clearAllEntities()" class="danger">清空所有实体</button>
        <hr style="border:none;border-top:1px solid #526f82;margin:10px 0;">
        <h3>业务场景示例</h3>
        <button onclick="addPipelineDemo()">管线路径标注</button>
        <button onclick="addAreaFenceDemo()">区域围栏</button>
        <button onclick="addTrajectoryDemo()">车辆轨迹回放</button>
    </div>
    <div id="queryPanel">
        <h3>查询实体</h3>
        <input id="queryInput" type="text" placeholder="输入实体 ID，如 station-01">
        <button onclick="queryById()" style="margin-top:8px;width:100%;padding:8px;background:#2ec5ad;color:#fff;border:none;border-radius:4px;cursor:pointer;">getById 查询</button>
        <div id="queryResult">等待查询…</div>
    </div>
    <div id="status">当前实体数：0</div>
    <div id="coordBar">
        <span><span class="coord-label">LNG</span><span class="coord-value" id="camLng">--</span></span>
        <span><span class="coord-label">LAT</span><span class="coord-value" id="camLat">--</span></span>
        <span><span class="coord-label">ALT</span><span class="coord-value" id="camAlt">--</span></span>
    </div>

    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            baseLayerPicker: false, geocoder: false, homeButton: false,
            sceneModePicker: false, navigationHelpButton: false,
            animation: false, timeline: false, fullscreenButton: false
        });

        viewer.scene.globe.depthTestAgainstTerrain = false;
        const entities = viewer.entities;
        let entityCounter = 0;

        function updateCount() {
            document.getElementById('status').textContent =
                '当前实体数：' + entities.values.length;
        }

        const sampleData = [
            { id: 'station-01', name: '监测站 A', lng: 116.39, lat: 39.91, status: '正常', type: '气象' },
            { id: 'station-02', name: '监测站 B', lng: 121.47, lat: 31.23, status: '告警', type: '水文' },
            { id: 'station-03', name: '监测站 C', lng: 113.26, lat: 23.13, status: '离线', type: '地质' }
        ];

        const statusColors = {
            '正常': Cesium.Color.fromCssColorString('#2ec5ad'),
            '告警': Cesium.Color.fromCssColorString('#ffc107'),
            '离线': Cesium.Color.fromCssColorString('#e74c3c')
        };

        function addSampleEntities() {
            sampleData.forEach(function (d) {
                if (entities.getById(d.id)) return;
                entities.add({
                    id: d.id,
                    name: d.name,
                    position: Cesium.Cartesian3.fromDegrees(d.lng, d.lat, 0),
                    point: {
                        pixelSize: 14,
                        color: statusColors[d.status] || Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 2,
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                    },
                    label: {
                        text: d.name + ' [' + d.status + ']',
                        font: '14px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -20),
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                    },
                    properties: {
                        bizId: d.id,
                        status: d.status,
                        type: d.type
                    }
                });
            });
            viewer.zoomTo(entities);
            updateCount();
        }

        function addBatchEntities() {
            for (let i = 0; i < 50; i++) {
                entityCounter++;
                const lng = 100 + Math.random() * 30;
                const lat = 20 + Math.random() * 20;
                entities.add({
                    id: 'batch-' + entityCounter,
                    name: '批量点 #' + entityCounter,
                    position: Cesium.Cartesian3.fromDegrees(lng, lat, 0),
                    point: {
                        pixelSize: 8,
                        color: Cesium.Color.CYAN.withAlpha(0.8),
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                    },
                    properties: { bizId: 'batch-' + entityCounter, status: '正常', type: '批量' }
                });
            }
            viewer.zoomTo(entities);
            updateCount();
        }

        function updateEntityStyle() {
            const all = entities.values;
            for (let i = 0; i < all.length; i++) {
                if (all[i].point) {
                    all[i].point.pixelSize = 10 + Math.random() * 10;
                    all[i].point.color = Cesium.Color.fromRandom({ alpha: 1.0 });
                }
            }
        }

        function removeLastEntity() {
            const all = entities.values;
            if (all.length > 0) {
                entities.remove(all[all.length - 1]);
                updateCount();
            }
        }

        function clearAllEntities() {
            entities.removeAll();
            updateCount();
        }

        function queryById() {
            const id = document.getElementById('queryInput').value.trim();
            const result = document.getElementById('queryResult');
            if (!id) { result.textContent = '请输入实体 ID'; return; }
            const entity = entities.getById(id);
            if (!entity) { result.textContent = '未找到 ID = "' + id + '" 的实体'; return; }
            const props = entity.properties;
            result.textContent =
                'ID:     ' + entity.id + '\n' +
                'Name:   ' + entity.name + '\n' +
                'BizId:  ' + (props && props.bizId ? props.bizId.getValue() : 'N/A') + '\n' +
                'Status: ' + (props && props.status ? props.status.getValue() : 'N/A') + '\n' +
                'Type:   ' + (props && props.type ? props.type.getValue() : 'N/A');
            console.log('[getById]', entity);
        }

        // ── 业务场景：管线路径标注 ──
        function addPipelineDemo() {
            clearAllEntities();
            var pipeCoords = [
                116.38, 39.92,
                116.39, 39.915,
                116.395, 39.918,
                116.41, 39.92,
                116.42, 39.925
            ];
            entities.add({
                id: 'pipeline-01',
                name: '供水管线 A-段',
                polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArray(pipeCoords),
                    width: 6,
                    material: new Cesium.PolylineGlowMaterialProperty({
                        glowPower: 0.3,
                        color: Cesium.Color.CYAN
                    }),
                    clampToGround: true
                },
                properties: { type: '供水管线', diameter: 'DN300', material: 'PE' }
            });
            for (var i = 0; i < pipeCoords.length; i += 2) {
                entities.add({
                    id: 'pipe-node-' + (i / 2),
                    name: '管线节点 #' + (i / 2),
                    position: Cesium.Cartesian3.fromDegrees(pipeCoords[i], pipeCoords[i + 1], 0),
                    point: { pixelSize: 10, color: Cesium.Color.YELLOW, outlineColor: Cesium.Color.BLACK, outlineWidth: 1, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
                    label: { text: 'N' + (i / 2), font: '12px sans-serif', fillColor: Cesium.Color.WHITE, style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2, outlineColor: Cesium.Color.BLACK, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -14), heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
                    properties: { type: '管线节点' }
                });
            }
            viewer.zoomTo(entities);
            updateCount();
        }

        // ── 业务场景：区域围栏 ──
        function addAreaFenceDemo() {
            clearAllEntities();
            entities.add({
                id: 'fence-zone-a',
                name: '重点保护区域 A',
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray([
                        116.38, 39.92, 116.42, 39.92, 116.42, 39.94, 116.38, 39.94
                    ]),
                    material: Cesium.Color.RED.withAlpha(0.25),
                    outline: true,
                    outlineColor: Cesium.Color.RED,
                    outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                },
                properties: { type: '保护区', level: '一级' }
            });
            entities.add({
                id: 'fence-zone-b',
                name: '施工缓冲区 B',
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray([
                        116.42, 39.91, 116.45, 39.91, 116.45, 39.93, 116.42, 39.93
                    ]),
                    material: Cesium.Color.ORANGE.withAlpha(0.2),
                    outline: true,
                    outlineColor: Cesium.Color.ORANGE,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                },
                properties: { type: '缓冲区', level: '二级' }
            });
            entities.add({
                id: 'fence-label-a',
                name: '保护区标注',
                position: Cesium.Cartesian3.fromDegrees(116.40, 39.93, 0),
                label: { text: '重点保护区域 A', font: 'bold 16px sans-serif', fillColor: Cesium.Color.RED, style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 3, outlineColor: Cesium.Color.WHITE, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND }
            });
            viewer.zoomTo(entities);
            updateCount();
        }

        // ── 业务场景：车辆轨迹回放 ──
        function addTrajectoryDemo() {
            clearAllEntities();
            var start = Cesium.JulianDate.fromDate(new Date());
            var totalSeconds = 60;
            var stop = Cesium.JulianDate.addSeconds(start, totalSeconds, new Cesium.JulianDate());

            viewer.clock.startTime = start.clone();
            viewer.clock.stopTime = stop.clone();
            viewer.clock.currentTime = start.clone();
            viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
            viewer.clock.multiplier = 5;
            viewer.clock.shouldAnimate = true;
            if (viewer.timeline) {
                viewer.timeline.zoomTo(start, stop);
            }

            var waypoints = [
                { lng: 116.38, lat: 39.91, t: 0 },
                { lng: 116.385, lat: 39.915, t: 10 },
                { lng: 116.39, lat: 39.92, t: 20 },
                { lng: 116.40, lat: 39.922, t: 30 },
                { lng: 116.41, lat: 39.918, t: 40 },
                { lng: 116.42, lat: 39.925, t: 50 },
                { lng: 116.43, lat: 39.93, t: 60 }
            ];
            var positionProperty = new Cesium.SampledPositionProperty();
            waypoints.forEach(function (wp) {
                var time = Cesium.JulianDate.addSeconds(start, wp.t, new Cesium.JulianDate());
                positionProperty.addSample(time, Cesium.Cartesian3.fromDegrees(wp.lng, wp.lat, 0));
            });

            entities.add({
                id: 'vehicle-01',
                name: '巡检车辆 #01',
                availability: new Cesium.TimeIntervalCollection([new Cesium.TimeInterval({ start: start, stop: stop })]),
                position: positionProperty,
                orientation: new Cesium.VelocityOrientationProperty(positionProperty),
                point: { pixelSize: 14, color: Cesium.Color.LIME, outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
                label: { text: '巡检车 #01', font: '13px sans-serif', fillColor: Cesium.Color.WHITE, style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2, outlineColor: Cesium.Color.BLACK, pixelOffset: new Cesium.Cartesian2(0, -22), heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
                path: { resolution: 1, material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.15, color: Cesium.Color.LIME }), width: 4 },
                properties: { type: '巡检车辆', plateNo: '京A12345' }
            });
            viewer.zoomTo(entities, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), 10000));
            updateCount();
        }

        // ── 实时相机坐标 ──
        var camLngEl = document.getElementById('camLng');
        var camLatEl = document.getElementById('camLat');
        var camAltEl = document.getElementById('camAlt');
        viewer.camera.changed.addEventListener(function () {
            var carto = Cesium.Cartographic.fromCartesian(viewer.camera.positionWC);
            camLngEl.textContent = Cesium.Math.toDegrees(carto.longitude).toFixed(4) + '°';
            camLatEl.textContent = Cesium.Math.toDegrees(carto.latitude).toFixed(4) + '°';
            var h = carto.height;
            camAltEl.textContent = h > 1000 ? (h / 1000).toFixed(1) + ' km' : h.toFixed(0) + ' m';
        });
        viewer.camera.percentageChanged = 0.01;
    </script>
</body>
</html>
